name: Web smoke (Vercel)

# The web app is deployed by Vercel's Git integration (project
# cc-statement-scraper, root apps/web): every push to main builds Production,
# every PR gets a Preview. This workflow does NOT deploy; adding a CLI deploy
# here would double-deploy. It verifies what Vercel shipped.
#
# It runs once per push to main that changes the web app: it waits for Vercel's
# Production deployment of that commit (GitHub Deployments API), then probes
# the production URL with
# scripts/ci/web-smoke.sh: 200 + <title>Bank Ledger</title>, CSP and security
# headers, an SPA deep link, a hashed asset (immutable) and a missing asset
# (404). It also runs daily, so a broken alias or expired domain is noticed
# without a deploy. Rollback: Vercel dashboard → Deployments → previous
# Production deployment → "Instant Rollback" (docs/ci-cd.md).

# Not `deployment_status`: that event fires for every state of every deployment
# (Vercel's queued/in-progress/ready, Previews, and our own `production`
# environment jobs), creating a skipped run each time.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'scripts/ci/web-smoke.sh'
      - '.github/workflows/web-smoke.yml'
  schedule:
    - cron: "17 5 * * *" # daily, 09:17 Dubai
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test"
        type: string
        default: https://<web-host>

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: web-smoke
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://<web-host>

jobs:
  smoke:
    name: Smoke test production web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          ref: ${{ github.event.repository.default_branch }}

      - name: Wait for production to serve this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          URL: ${{ env.PRODUCTION_URL }}
        run: |
          # Every build stamps its commit in <meta name="ledger-build"> (apps/web/vite.config.ts),
          # so this asks production what it serves instead of trusting Vercel's GitHub reports:
          # Vercel often posts neither a Deployment nor a "Vercel" status (a346956, f683280 shipped
          # with none, and this step used to wait them out and fail). Production serving this
          # commit, or a newer one that contains it, is a pass. A "Vercel" status of failure/error
          # still fails fast. 36 x 15 s stays inside the job's timeout.
          for attempt in $(seq 1 36); do
            served=$(curl -fsS --max-time 20 "$URL/" | grep -o '<meta name="ledger-build" content="[0-9a-f]*"' \
              | sed 's/.*content="//; s/"$//' || true)
            if [ -n "$served" ]; then
              rel=$(gh api "repos/$REPO/compare/$SHA...$served" --jq .status 2>/dev/null || true)
              case "$rel" in
                identical|ahead) echo "production serves ${served::7} (contains ${SHA::7}: $rel)"; exit 0 ;;
              esac
            fi
            vercel=$(gh api "repos/$REPO/commits/$SHA/statuses?per_page=100" \
              --jq '[.[] | select(.context == "Vercel")][0].state // ""' || true)
            echo "attempt $attempt: production serves '${served:-unknown}', Vercel status '${vercel:-none}'"
            case "$vercel" in
              failure|error) echo "::error::Vercel's Production deployment of $SHA ended in '$vercel'"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Production still doesn't serve $SHA after 9 minutes (serves '${served:-unknown}'): Vercel didn't ship this push"; exit 1

      - name: Smoke test
        env:
          URL: ${{ inputs.url || env.PRODUCTION_URL }}
        run: bash scripts/ci/web-smoke.sh "$URL"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          URL: ${{ inputs.url || env.PRODUCTION_URL }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          {
            echo "### Web smoke: $OUTCOME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | $GITHUB_EVENT_NAME |"
            echo "| Tested | $URL |"
            [ -n "$DEPLOY_SHA" ] && echo "| Deployed commit | \`${DEPLOY_SHA::7}\` |"
            [ -n "$DEPLOY_URL" ] && echo "| Vercel deployment | $DEPLOY_URL |"
            echo ""
            if [ "$OUTCOME" != "success" ]; then
              echo "Roll back: Vercel → cc-statement-scraper → Deployments → last good Production → Instant Rollback."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
