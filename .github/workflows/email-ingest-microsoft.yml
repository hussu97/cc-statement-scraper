# LEGACY (v1) — deploys/operates the frozen backend/, frontend/ or Gmail relay.
# Replaced by Ledger v2 (Supabase + deploy-supabase.yml / deploy-parser.yml,
# outlook-poll and gmail-push Edge Functions). Do not extend.
#
# Guarded by the repository variable LEGACY_DEPLOYS_ENABLED: every job is
# skipped unless it is exactly 'true'. Set it to 'true' BEFORE merging
# ledger-v2 into main (keeps legacy running until cutover), set it to 'false'
# and `gh workflow disable` this file at cutover step 1, delete the file at
# decommission (PRODUCTION.md §10).
name: Email Ingest Microsoft

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # Daily at 14:00 DXB (UTC+4)

permissions:
  contents: read

jobs:
  ingest:
    if: vars.LEGACY_DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements.txt

      - name: Run Microsoft ingestion
        env:
          CCS_API_BASE_URL: ${{ secrets.CCS_API_BASE_URL }}
          CCS_SERVICE_TOKEN: ${{ secrets.CCS_SERVICE_TOKEN }}
        run: |
          python backend/scripts/email_ingest_microsoft.py
