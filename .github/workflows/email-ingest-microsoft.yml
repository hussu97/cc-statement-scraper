name: Email Ingest Microsoft

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"  # Daily at 14:00 DXB (UTC+4)

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Microsoft ingestion
        env:
          CCS_API_BASE_URL: ${{ secrets.CCS_API_BASE_URL }}
          CCS_SERVICE_TOKEN: ${{ secrets.CCS_SERVICE_TOKEN }}
        run: |
          python backend/scripts/email_ingest_microsoft.py
