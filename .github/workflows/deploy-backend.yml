# LEGACY (v1) — deploys/operates the frozen backend/, frontend/ or Gmail relay.
# Replaced by Ledger v2 (Supabase + deploy-supabase.yml / deploy-parser.yml,
# outlook-poll and gmail-push Edge Functions). Do not extend.
#
# Guarded by the repository variable LEGACY_DEPLOYS_ENABLED: every job is
# skipped unless it is exactly 'true'. Set it to 'true' BEFORE merging
# ledger-v2 into main (keeps legacy running until cutover), set it to 'false'
# and `gh workflow disable` this file at cutover step 1, delete the file at
# decommission (PRODUCTION.md §10).
name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Detect whether backend-relevant files changed in this push.
  # We must do this here because workflow_run doesn't support path
  # filters at the trigger level.
  # ------------------------------------------------------------------
  check-changes:
    if: ${{ vars.LEGACY_DEPLOYS_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect backend changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.workflow_run.event.before }}
        run: |
          # Compare every commit in the push (before..head) against the last
          # remote commit so that multi-commit pushes are handled correctly.
          # Falls back to HEAD~1 only when before is the null SHA (first push).
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$NULL_SHA" ] || [ -z "$BEFORE_SHA" ]; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE_SHA"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE \
            '^(backend/|deploy/Dockerfile\.api|deploy/docker-compose\.prod\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-changes
    if: vars.LEGACY_DEPLOYS_ENABLED == 'true' && needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Render
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
