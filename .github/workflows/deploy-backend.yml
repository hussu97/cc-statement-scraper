name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Detect whether backend-relevant files changed in this push.
  # We must do this here because workflow_run doesn't support path
  # filters at the trigger level.
  # ------------------------------------------------------------------
  check-changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect backend changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE \
            '^(backend/|deploy/Dockerfile\.api|deploy/docker-compose\.prod\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to Render
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
