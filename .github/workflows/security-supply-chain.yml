name: Security Supply Chain

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pip-audit bandit

      - name: Dependency vulnerability scan (block critical)
        run: pip-audit -r requirements.txt --strict

      - name: SAST scan (Bandit)
        run: bandit -q -r src -x tests -ll -ii

  container-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f deploy/Dockerfile.app -t ccs-platform-app:${{ github.sha }} .

      - name: Scan app image with Trivy (block HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ccs-platform-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ccs-platform-app:${{ github.sha }}
          output-file: ccs-platform-app.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccs-platform-app-sbom
          path: ccs-platform-app.spdx.json

  sign-and-verify-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - python-security
      - container-security
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push signed target image
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}/ccs-platform-app:${{ github.sha }}
        run: |
          docker build -f deploy/Dockerfile.app -t "$IMAGE_REF" .
          docker push "$IMAGE_REF"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with keyless OIDC identity
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ghcr.io/${{ github.repository }}/ccs-platform-app:${{ github.sha }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ghcr.io/${{ github.repository }}/ccs-platform-app:${{ github.sha }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            "$IMAGE_REF"
