name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # CI workflow must pass first — enforced via branch protection rules
    steps:
      - name: Deploy backend to Render
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Deploy frontend to Vercel
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
