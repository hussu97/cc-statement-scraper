name: Deploy Parser

# Builds services/parser, pushes it to Artifact Registry and rolls it out to the
# `ccs-parser` Cloud Run service (project $GCP_PROJECT_ID, me-central1).
#
#   test     ruff + pytest. No secrets.
#   deploy   `production` environment. The new revision is deployed with
#            --no-traffic under a tag, its /health is smoke-tested on the tag
#            URL (status ok + the parser_version from pyproject.toml), and only
#            then does it receive 100% of traffic. A failed smoke test leaves
#            production on the previous revision: nothing to roll back.
#
# Triggers: a push to main that changes services/parser/**, or manual dispatch
# from main with "deploy" typed as confirmation. The repository variable
# AUTO_DEPLOY=false turns push runs off (manual still works).
#
# GCP auth: Workload Identity Federation only (repository variables
# GCP_WIF_PROVIDER and GCP_DEPLOY_SA; no service-account key exists anywhere).
# One-time setup in docs/ci-cd.md §5.
# Secret SUPABASE_PROJECT_REF feeds PARSER_ALLOWED_HOSTS. Runtime secrets live
# in Secret Manager (parser-secret, parser-sentry-dsn; PRODUCTION.md §3).

on:
  push:
    branches: [main]
    paths:
      - 'services/parser/**'
      - '!services/parser/**/*.md'
      - '!services/parser/tests/**'
      - '.github/workflows/deploy-parser.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to deploy the parser to production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-parser
  cancel-in-progress: false

env:
  SERVICE: ccs-parser
  REGION: me-central1
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}

jobs:
  test:
    name: Test (ruff, pytest)
    # A push only deploys when AUTO_DEPLOY isn't 'false'; manual runs always do.
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/parser
    steps:
      - name: Require main and confirmation
        working-directory: .
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys run only from main (got $REF); nothing deployed."
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Type 'deploy' to confirm; nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            services/parser/requirements.txt
            services/parser/pyproject.toml

      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python requirements.txt
          uv pip install --python .venv/bin/python --no-deps -e .
          uv pip install --python .venv/bin/python pytest ruff

      - name: ruff
        run: .venv/bin/ruff check --output-format=github .

      - name: pytest
        run: .venv/bin/pytest -q

  deploy:
    name: Deploy to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.promote.outputs.url }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER }}
      DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA || vars.GCP_DEPLOY_SA }}
    steps:
      - name: Verify configuration
        run: |
          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Secret SUPABASE_PROJECT_REF is not set on the production environment (docs/ci-cd.md)"; exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; then
            echo "::error::Set the repository secrets GCP_WIF_PROVIDER and GCP_DEPLOY_SA (docs/ci-cd.md §5)"; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          SHA="${GITHUB_SHA::7}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' services/parser/pyproject.toml | head -1)
          {
            echo "SHA=$SHA"
            echo "TAG=sha-$SHA"
            echo "IMAGE=${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/ledger/${SERVICE}:${SHA}"
            echo "PARSER_VERSION=$VERSION"
          } >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/parser
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=parser
          cache-to: type=gha,mode=max,scope=parser

      - name: Record the serving revision
        run: |
          PREVIOUS=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
          echo "Currently serving: ${PREVIOUS:-<service does not exist yet>}"

      - name: Deploy new revision (no traffic)
        run: |
          # --no-traffic needs an existing service; a first deploy takes traffic directly.
          TRAFFIC_FLAGS=(--no-traffic --tag "$TAG")
          [ -n "$PREVIOUS" ] || TRAFFIC_FLAGS=()
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --project="$GCP_PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --service-account="ccs-parser@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=4 \
            --timeout=120 \
            --set-secrets="PARSER_SECRET=parser-secret:latest,SENTRY_DSN=parser-sentry-dsn:latest" \
            --set-env-vars="SENTRY_ENVIRONMENT=production,SENTRY_RELEASE=${SHA},PARSER_ALLOWED_HOSTS=${PROJECT_REF}.supabase.co" \
            "${TRAFFIC_FLAGS[@]}" \
            --quiet

      - name: Smoke test the new revision
        run: |
          if [ -n "$PREVIOUS" ]; then
            URL=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --format=json \
              | jq -r --arg t "$TAG" '.status.traffic[] | select(.tag == $t) | .url')
          else
            URL=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')
          fi
          [ -n "$URL" ] || { echo "::error::could not resolve the URL of tag $TAG"; exit 1; }
          echo "Probing $URL/health (cold start allowed)"
          for attempt in 1 2 3 4 5; do
            if BODY=$(curl -fsS --max-time 30 "$URL/health"); then break; fi
            BODY=""; echo "attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          echo "$BODY"
          [ "$(jq -r .status <<<"$BODY")" = "ok" ] || { echo "::error::/health did not return status ok"; exit 1; }
          GOT=$(jq -r .parser_version <<<"$BODY")
          [ "$GOT" = "$PARSER_VERSION" ] || { echo "::error::/health parser_version $GOT != pyproject $PARSER_VERSION"; exit 1; }

      - name: Promote to 100% traffic
        id: promote
        run: |
          if [ -n "$PREVIOUS" ]; then
            gcloud run services update-traffic "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --to-latest --quiet
            gcloud run services update-traffic "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --remove-tags "$TAG" --quiet
          fi
          URL=$(gcloud run services describe "$SERVICE" --project "$GCP_PROJECT_ID" --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 "$URL/health"

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          URL: ${{ steps.promote.outputs.url }}
        run: |
          {
            echo "### Parser deploy: $OUTCOME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE:-not built}\` |"
            echo "| parser_version | ${PARSER_VERSION:-?} |"
            echo "| Previous revision | ${PREVIOUS:-none} |"
            echo "| URL | ${URL:-not promoted} |"
            echo ""
            echo "Roll back: \`gcloud run services update-traffic $SERVICE --region $REGION --project $GCP_PROJECT_ID --to-revisions ${PREVIOUS:-<revision>}=100\`"
          } >> "$GITHUB_STEP_SUMMARY"
