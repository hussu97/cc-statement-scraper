name: Deploy Parser (Cloud Run)

# Manual only. Builds services/parser, pushes it to Artifact Registry and deploys
# the `ccs-parser` Cloud Run service (scale to zero). Same GCP auth pattern as the
# legacy deploy-gmail-relay workflow.
#
# Secrets:
#   GCP_SA_KEY            deployer service-account JSON (run.admin, artifactregistry.writer,
#                         iam.serviceAccountUser on ccs-parser@)
#   GCP_PROJECT_ID        GCP project
#   SUPABASE_PROJECT_REF  used for PARSER_ALLOWED_HOSTS (<ref>.supabase.co)
# One-time setup (PRODUCTION.md §3): Secret Manager secrets `parser-secret` and
# `parser-sentry-dsn`, and the runtime service account `ccs-parser@<project>`.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to deploy the parser to production"
        required: true
        type: string
      region:
        description: "Cloud Run / Artifact Registry region"
        type: choice
        default: europe-west1
        options:
          - europe-west1
          - me-central1

permissions:
  contents: read

concurrency:
  group: deploy-parser
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SERVICE: ccs-parser
      REGION: ${{ inputs.region }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo "::error::Type 'deploy' to confirm; nothing deployed."
            exit 1
          fi
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::GCP_PROJECT_ID and SUPABASE_PROJECT_REF must be set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/ccs-platform/${SERVICE}:${SHA}"
          docker build --platform linux/amd64 -t "$IMAGE" services/parser
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --project="$GCP_PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --service-account="ccs-parser@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=3 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=4 \
            --timeout=120 \
            --set-secrets="PARSER_SECRET=parser-secret:latest,SENTRY_DSN=parser-sentry-dsn:latest" \
            --set-env-vars="SENTRY_ENVIRONMENT=production,SENTRY_RELEASE=${SHA},PARSER_ALLOWED_HOSTS=${PROJECT_REF}.supabase.co" \
            --quiet

      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project="$GCP_PROJECT_ID" --region="$REGION" --format='value(status.url)')
          curl -fsS "$URL/health"
