name: Security Scan

# Weekly dependency and SAST scans of the Ledger parser (the only Python we
# ship as an image). Docs: docs/ci-cd.md.

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security
  cancel-in-progress: true

jobs:
  # Ledger v2 parser (Cloud Run image).
  parser:
    name: Parser (pip-audit, bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: pip-audit -r services/parser/requirements.txt --strict --disable-pip --no-deps  # fully pinned by uv pip compile

      - name: SAST scan
        run: bandit -q -r services/parser/ccs_parser -ll -ii
