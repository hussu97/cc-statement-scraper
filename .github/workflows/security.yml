name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: grep -v '^-e' backend/requirements.txt | pip-audit -r /dev/stdin --strict

      - name: SAST scan
        run: bandit -q -r backend/ccs_platform -x backend/tests -ll -ii

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile.api -t ccs-app:scan .

      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ccs-app:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
