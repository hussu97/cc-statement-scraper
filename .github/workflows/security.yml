name: Security Scan

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ledger v2 parser (Cloud Run image).
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: pip-audit -r services/parser/requirements.txt --strict --disable-pip --no-deps  # fully pinned by uv pip compile

      - name: SAST scan
        run: bandit -q -r services/parser/ccs_parser -ll -ii

  # LEGACY (v1): backend/ and its image; remove at decommission (PRODUCTION.md §10).
  # Skipped unless the repo variable LEGACY_DEPLOYS_ENABLED is 'true', so these
  # jobs stop at cutover and never fail once backend/ is deleted.
  python:
    if: vars.LEGACY_DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: grep -v '^-e' backend/requirements.txt | pip-audit -r /dev/stdin --strict

      - name: SAST scan
        run: bandit -q -r backend/ccs_platform -x backend/tests -ll -ii

  # LEGACY (v1); same guard as `python`.
  container:
    if: vars.LEGACY_DEPLOYS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile.api -t ccs-app:scan .

      - name: Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ccs-app:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
