# LEGACY (v1) — deploys/operates the frozen backend/, frontend/ or Gmail relay.
# Replaced by Ledger v2 (Supabase + deploy-supabase.yml / deploy-parser.yml,
# outlook-poll and gmail-push Edge Functions). Do not extend.
#
# Guarded by the repository variable LEGACY_DEPLOYS_ENABLED: every job is
# skipped unless it is exactly 'true'. Set it to 'true' BEFORE merging
# ledger-v2 into main (keeps legacy running until cutover), set it to 'false'
# and `gh workflow disable` this file at cutover step 1, delete the file at
# decommission (PRODUCTION.md §10).
name: Deploy Gmail Relay

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Detect whether gmail-relay-relevant files changed in this push.
  # ------------------------------------------------------------------
  check-changes:
    if: ${{ vars.LEGACY_DEPLOYS_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect gmail relay changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.workflow_run.event.before }}
        run: |
          # Compare every commit in the push (before..head) against the last
          # remote commit so that multi-commit pushes are handled correctly.
          # Falls back to HEAD~1 only when before is the null SHA (first push).
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$NULL_SHA" ] || [ -z "$BEFORE_SHA" ]; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE_SHA"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE \
            '^(backend/scripts/gmail_ingest_relay\.py|backend/scripts/email_ingestion_common\.py|backend/requirements\.txt|deploy/Dockerfile\.gmail-relay)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-changes
    if: vars.LEGACY_DEPLOYS_ENABLED == 'true' && needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ccs-platform/gmail-relay:$SHA"
          docker build --platform linux/amd64 -f deploy/Dockerfile.gmail-relay -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ccs-gmail-relay \
            --image="$IMAGE" \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="CCS_API_BASE_URL=${{ secrets.CCS_API_BASE_URL }}" \
            --set-env-vars="CCS_SERVICE_TOKEN=${{ secrets.CCS_GMAIL_RELAY_SERVICE_TOKEN }}" \
            --port=8080 \
            --command=uvicorn \
            --args="gmail_ingest_relay:app,--host,0.0.0.0,--port,8080" \
            --min-instances=0 \
            --memory=256Mi \
            --cpu=1 \
            --quiet
