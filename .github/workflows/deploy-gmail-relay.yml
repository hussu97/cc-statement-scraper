name: Deploy Gmail Relay

on:
  push:
    branches: [main]
    paths:
      - "backend/scripts/gmail_ingest_relay.py"
      - "backend/scripts/email_ingestion_common.py"
      - "backend/requirements.txt"
      - "deploy/Dockerfile.api"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE="europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ccs-platform/gmail-relay:$SHA"
          docker build -f deploy/Dockerfile.api -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ccs-gmail-relay \
            --image="$IMAGE" \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="CCS_API_BASE_URL=${{ secrets.CCS_API_BASE_URL }}" \
            --set-env-vars="CCS_SERVICE_TOKEN=${{ secrets.CCS_GMAIL_RELAY_SERVICE_TOKEN }}" \
            --port=8080 \
            --command="python,backend/scripts/gmail_ingest_relay.py" \
            --min-instances=0 \
            --memory=256Mi \
            --cpu=1 \
            --quiet
