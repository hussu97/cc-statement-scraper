name: Deploy Frontend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Detect whether frontend-relevant files changed in this push.
  # ------------------------------------------------------------------
  check-changes:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Detect frontend changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.workflow_run.event.before }}
        run: |
          # Compare every commit in the push (before..head) against the last
          # remote commit so that multi-commit pushes are handled correctly.
          # Falls back to HEAD~1 only when before is the null SHA (first push).
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$NULL_SHA" ] || [ -z "$BEFORE_SHA" ]; then
            BASE="HEAD~1"
          else
            BASE="$BEFORE_SHA"
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE \
            '^(frontend/|deploy/Dockerfile\.(frontend|app))'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy frontend to Vercel
        run: curl -fsSL -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
