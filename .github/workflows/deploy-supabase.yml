name: Deploy Supabase

# Applies supabase/migrations to the production project and deploys the Edge
# Functions. Production data is irreplaceable, so every run goes through:
#
#   test      pgTAP is CI's: this waits for ci.yml's "Supabase (migrations, pgTAP, types)"
#             job on the same commit and refuses to deploy unless it passed (no Docker
#             here, so a registry limit can't stall a deploy); then deno lint/check/test
#             (frozen lock). No secrets.
#   deploy    `production` environment (put required reviewers on it, so a
#             push waits for a human click). Links the project, then:
#               1. history check: every applied migration still exists and is
#                  byte-identical to when it landed on main (append-only), no
#                  pending migration is older than the newest applied one
#               2. dry run: prints the pending migrations (job summary too)
#               3. destructive guard: DROP TABLE/SCHEMA/COLUMN, TRUNCATE or
#                  DELETE FROM in a pending migration blocks a push-triggered
#                  run; re-run manually with allow_destructive
#               4. `supabase db push`, then `supabase functions deploy`
#
# Triggers: a push to main that changes supabase/** (migrations only if
# migrations changed, functions only if functions changed), or manual dispatch
# from main with the project ref typed as confirmation. Set the repository
# variable AUTO_DEPLOY=false to make push runs plan-only (dry run).
#
# Secrets (on the `production` environment): SUPABASE_ACCESS_TOKEN,
# SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF. Function secrets and Vault
# entries are NOT managed here (PRODUCTION.md §2.4–2.5). Docs: docs/ci-cd.md.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '!supabase/functions/_tests/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the production project ref to confirm"
        required: true
        type: string
      db_push:
        description: "Apply pending migrations (supabase db push)"
        type: boolean
        default: true
      deploy_functions:
        description: "Deploy all Edge Functions"
        type: boolean
        default: true
      dry_run:
        description: "Only check history and list pending migrations; deploy nothing"
        type: boolean
        default: false
      allow_destructive:
        description: "Allow pending migrations that DROP/TRUNCATE/DELETE"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time and never cancelled midway: a half-applied migration
# batch with no job left to finish it is the worst outcome. Queue instead.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      migrations: ${{ steps.what.outputs.migrations }}
      functions: ${{ steps.what.outputs.functions }}
      dry_run: ${{ steps.what.outputs.dry_run }}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys run only from main (got $REF); nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Decide what to deploy
        id: what
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_DB_PUSH: ${{ inputs.db_push }}
          IN_FUNCTIONS: ${{ inputs.deploy_functions }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          AUTO_DEPLOY: ${{ vars.AUTO_DEPLOY }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            migrations="$IN_DB_PUSH"; functions="$IN_FUNCTIONS"; dry_run="$IN_DRY_RUN"
          else
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            else
              changed=$(git show --name-only --format= "$GITHUB_SHA")
            fi
            migrations=false; functions=false
            grep -qE '^supabase/migrations/' <<<"$changed" && migrations=true
            # Function sources or config.toml; test-only edits deploy nothing.
            grep -E '^supabase/(functions/|config\.toml$)' <<<"$changed" | grep -vqE '^supabase/functions/_tests/' \
              && functions=true
            grep -qE '^\.github/workflows/deploy-supabase\.yml$' <<<"$changed" && [ "$migrations$functions" = falsefalse ] \
              && { migrations=true; echo "Workflow changed only: planning migrations as a dry run."; dry_run_forced=true; }
            dry_run=false
            [ "${dry_run_forced:-false}" = true ] && dry_run=true
            [ "$AUTO_DEPLOY" = "false" ] && dry_run=true
          fi
          printf 'migrations=%s\nfunctions=%s\ndry_run=%s\n' "$migrations" "$functions" "$dry_run" >> "$GITHUB_OUTPUT"
          {
            echo "### Supabase deploy plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | $EVENT |"
            echo "| Migrations | $migrations |"
            echo "| Edge Functions | $functions |"
            echo "| Dry run | $dry_run |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Test (pgTAP, deno)
    needs: plan
    if: needs.plan.outputs.migrations == 'true' || needs.plan.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4

      # CI runs the migrations from scratch and pgTAP on every push to main that changes them
      # (same commit, same tests). Wait for its latest attempt; a manual run of an older
      # commit finds that commit's result.
      - name: pgTAP passed in CI for this commit
        if: needs.plan.outputs.migrations == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          CHECK: "Supabase (migrations, pgTAP, types)"
        run: |
          name=$(jq -rn --arg n "$CHECK" '$n|@uri')
          for i in $(seq 1 80); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=$name&filter=latest" \
                    -q '.check_runs | sort_by(.started_at) | last // {} | "\(.status // "missing") \(.conclusion // "")"')
            case "$run" in
              "completed success") echo "CI pgTAP passed for ${SHA::7}."; exit 0 ;;
              completed*) echo "::error::CI's \"$CHECK\" for ${SHA::7} ended ${run#completed }: fix or re-run it, then re-run this deploy."; exit 1 ;;
            esac
            echo "CI's \"$CHECK\": ${run% *} ($i/80), waiting"
            sleep 30
          done
          echo "::error::CI's \"$CHECK\" for ${SHA::7} did not finish in 40 minutes."
          exit 1

      - uses: denoland/setup-deno@v2
        if: needs.plan.outputs.functions == 'true'
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.lock', 'supabase/functions/deno.json') }}

      # The deploy bundles with supabase/functions/deno.lock (the edge runtime reads it);
      # --frozen fails here, before anything ships, if the lock doesn't match the sources.
      - name: deno lint + check + test (frozen lock)
        if: needs.plan.outputs.functions == 'true'
        working-directory: supabase/functions
        run: |
          deno lint
          deno check --frozen .
          deno test --frozen -A .

  deploy:
    name: Deploy to production
    needs: [plan, test]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://supabase.com/dashboard/project/<project-ref>
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DO_MIGRATIONS: ${{ needs.plan.outputs.migrations }}
      DO_FUNCTIONS: ${{ needs.plan.outputs.functions }}
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
    steps:
      - name: Verify secrets and confirmation
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm_project_ref }}
        run: |
          missing=()
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing secrets on the production environment: ${missing[*]} (docs/ci-cd.md)"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$CONFIRM" != "$PROJECT_REF" ]; then
            echo "::error::Confirmation does not match the production project ref; nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # check-migrations.sh walks main's first-parent history.
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migration history (append-only) and pending list
        id: history
        run: bash scripts/ci/check-migrations.sh remote linked

      - name: Dry run (supabase db push --dry-run)
        if: env.DO_MIGRATIONS == 'true'
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Destructive migration guard
        if: env.DO_MIGRATIONS == 'true' && steps.history.outputs.destructive == 'true'
        env:
          ALLOW: ${{ inputs.allow_destructive }}
        run: |
          if [ "$ALLOW" != "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Pending migrations contain DROP/TRUNCATE/DELETE (see the summary). Take a backup, then re-run this workflow manually with allow_destructive."
            exit 1
          fi
          echo "::warning::Destructive statements allowed for this run."

      - name: Apply migrations
        if: env.DO_MIGRATIONS == 'true' && env.DRY_RUN != 'true' && steps.history.outputs.pending_count != '0'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Verify nothing is pending
        if: env.DO_MIGRATIONS == 'true' && env.DRY_RUN != 'true'
        run: |
          left=$(supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --output-format json 2>/dev/null \
            | sed -n '/^{/,$p' | jq '[.migrations[] | select((.remote // "") == "")] | length')
          [ "$left" = "0" ] || { echo "::error::$left migration(s) still pending after db push"; exit 1; }

      - name: Tag Sentry release for Edge Functions
        if: env.DO_FUNCTIONS == 'true' && env.DRY_RUN != 'true'
        run: supabase secrets set --project-ref "$PROJECT_REF" "SENTRY_RELEASE=${GITHUB_SHA::7}"

      - name: Deploy Edge Functions
        if: env.DO_FUNCTIONS == 'true' && env.DRY_RUN != 'true'
        # Every function in supabase/functions; verify_jwt comes from config.toml.
        # --use-api bundles server-side, so the runner needs no Docker for this.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          PENDING: ${{ steps.history.outputs.pending_count }}
        run: |
          {
            echo "### Supabase deploy: $OUTCOME"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Migrations | $DO_MIGRATIONS (pending before: ${PENDING:-?}) |"
            echo "| Edge Functions | $DO_FUNCTIONS |"
            echo "| Dry run | $DRY_RUN |"
          } >> "$GITHUB_STEP_SUMMARY"
