name: Deploy Supabase (production)

# Manual only. Applies supabase/migrations to the production project and/or
# deploys every Edge Function. Never triggered automatically: production data
# is irreplaceable (CLAUDE.md §11, PRODUCTION.md §2 and §10).
#
# Secrets (put them on the `production` environment, with required reviewers):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   database password of the project
#   SUPABASE_PROJECT_REF   <project-ref>
#
# Function secrets (CRON_SECRET, PARSER_URL, …) and Vault entries are NOT managed
# here; set them once with `supabase secrets set` / the SQL editor (PRODUCTION.md).

on:
  workflow_dispatch:
    inputs:
      confirm_project_ref:
        description: "Type the production project ref to confirm"
        required: true
        type: string
      db_push:
        description: "Apply pending migrations (supabase db push)"
        type: boolean
        default: true
      deploy_functions:
        description: "Deploy all Edge Functions"
        type: boolean
        default: true
      dry_run:
        description: "Only list pending migrations (db push --dry-run); deploy nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Confirm target
        env:
          CONFIRM: ${{ inputs.confirm_project_ref }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_PROJECT_REF, SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD must be set"
            exit 1
          fi
          if [ "$CONFIRM" != "$PROJECT_REF" ]; then
            echo "::error::Confirmation does not match the production project ref; nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Pending migrations
        if: inputs.db_push || inputs.dry_run
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        if: inputs.db_push && !inputs.dry_run
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Tag Sentry release for Edge Functions
        if: inputs.deploy_functions && !inputs.dry_run
        run: supabase secrets set --project-ref "$PROJECT_REF" "SENTRY_RELEASE=${GITHUB_SHA::7}"

      - name: Deploy Edge Functions
        if: inputs.deploy_functions && !inputs.dry_run
        # Deploys every function in supabase/functions; verify_jwt comes from config.toml.
        run: supabase functions deploy --project-ref "$PROJECT_REF"
