name: Migration Safety

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sqlite-migration-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Migration preflight (structure checks)
        env:
          CCS_PLATFORM_DATABASE_URL: sqlite:///./tmp_ci_migration.db
        run: |
          cd backend && python scripts/migration_preflight.py --skip-database-state

      - name: Upgrade/downgrade smoke on SQLite
        env:
          CCS_PLATFORM_DATABASE_URL: sqlite:///./tmp_ci_migration.db
        run: |
          cd backend && alembic upgrade head
          cd backend && alembic downgrade base
          cd backend && alembic upgrade head

      - name: Migration preflight (db state checks)
        env:
          CCS_PLATFORM_DATABASE_URL: sqlite:///./tmp_ci_migration.db
        run: |
          cd backend && python scripts/migration_preflight.py

  postgres-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccs
          POSTGRES_PASSWORD: ccs
          POSTGRES_DB: ccs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccs -d ccs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Upgrade/downgrade smoke on Postgres
        env:
          CCS_PLATFORM_DATABASE_URL: postgresql+psycopg://ccs:ccs@127.0.0.1:5432/ccs
        run: |
          cd backend && alembic upgrade head
          cd backend && alembic downgrade base
          cd backend && alembic upgrade head

      - name: Migration preflight (db state checks)
        env:
          CCS_PLATFORM_DATABASE_URL: postgresql+psycopg://ccs:ccs@127.0.0.1:5432/ccs
        run: |
          cd backend && python scripts/migration_preflight.py
