name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Detect which top-level areas changed so downstream jobs can skip
  # when their files are untouched.
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/Dockerfile.api'
              - 'deploy/Dockerfile.app'
              - 'deploy/docker-compose.prod.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/Dockerfile.frontend'
              - 'deploy/Dockerfile.app'

  # ------------------------------------------------------------------
  # Backend: tests + migrations (runs in parallel with backend-security)
  # ------------------------------------------------------------------
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccs
          POSTGRES_PASSWORD: ccs
          POSTGRES_DB: ccs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccs -d ccs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -e backend/ -r backend/requirements.txt -r backend/requirements-dev.txt pytest-xdist

      - name: Syntax check
        run: python -m compileall backend/ccs_platform backend/scripts

      - name: Run tests
        run: cd backend && python -m pytest -q -n auto

      - name: Migration smoke (SQLite)
        env:
          CCS_PLATFORM_DATABASE_URL: sqlite:///./ci.db
        run: |
          cd backend
          python scripts/migration_preflight.py --skip-database-state
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python scripts/migration_preflight.py

      - name: Migration smoke (Postgres)
        env:
          CCS_PLATFORM_DATABASE_URL: postgresql+psycopg://ccs:ccs@127.0.0.1:5432/ccs
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python scripts/migration_preflight.py

  # ------------------------------------------------------------------
  # Backend security: vulnerability + SAST scans (parallel with backend)
  # ------------------------------------------------------------------
  backend-security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install audit tools
        run: pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: pip-audit -r backend/requirements.txt --strict

      - name: SAST scan
        run: bandit -q -r backend/ccs_platform -x backend/tests -ll -ii

  # ------------------------------------------------------------------
  # Frontend: unit tests + build
  # ------------------------------------------------------------------
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm test -- --run
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
