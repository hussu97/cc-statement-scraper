name: CI

# Path-filtered checks for every Ledger area, plus one aggregator job (`ci-ok`)
# that branch protection can require instead of a list of job names that
# changes whenever a job is added. The local pre-push hook
# (scripts/hooks/pre-push) runs the same checks with the same path rules, so a
# red CI run should never be the first place a failure shows up.
# Docs: docs/ci-cd.md.

on:
  pull_request:
  push:
    branches: [main]
  # No macOS job here: LedgerKit tests, the app compile and the signed release
  # build run on the Mac in the pre-push hook (docs/ci-cd.md).
  workflow_dispatch:

permissions:
  contents: read

# PRs: only the newest commit matters, so cancel superseded runs. main: let
# every push finish (each one is a candidate for the deploy workflows).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so `supabase gen types` output is stable for the drift check.
  # Bump together with a `pnpm db:types` regeneration (and in deploy-supabase.yml).
  SUPABASE_CLI_VERSION: 2.109.1
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------
  # Which areas changed. A manual run checks everything (iOS on request).
  # Keep these globs in sync with area_of() in scripts/hooks/pre-push.
  # ------------------------------------------------------------------
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # dorny/paths-filter lists PR files through the REST API, which needs
    # pull-requests: read in a private repo (job-level permissions replace the
    # workflow-level block, so contents: read is repeated).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      supabase: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.supabase == 'true' }}
      migrations: ${{ steps.filter.outputs.migrations == 'true' }}
      edge: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.edge == 'true' }}
      parser: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.parser == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      scraper: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.scraper == 'true' }}
      tooling: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.tooling == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            supabase:
              - 'supabase/migrations/**'
              - 'supabase/tests/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
              - 'packages/db-types/**'
              - 'scripts/ci/check-migrations.sh'
              - '.github/workflows/ci.yml'
            migrations:
              - 'supabase/migrations/**'
            edge:
              - 'supabase/functions/**'
              - 'supabase/config.toml'
              - '.github/workflows/ci.yml'
            parser:
              - 'services/parser/**'
              - 'docs/contracts/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            scraper:
              - 'scraper/**'
              - '.github/workflows/ci.yml'
            tooling:
              - '.github/workflows/**'
              - 'scripts/hooks/**'
              - 'scripts/ci/**'
              - 'scripts/install-hooks.sh'
              - 'scripts/cutover/*.sh'
              - 'apps/ios/scripts/*.sh'
              - '.claude/hooks/**'

  # ------------------------------------------------------------------
  # Workflows + shell: actionlint (with shellcheck on run: blocks) and
  # shellcheck on the hooks and CI scripts. Seconds, Linux.
  # ------------------------------------------------------------------
  tooling:
    name: Workflows & scripts lint
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck -x scripts/hooks/* scripts/ci/*.sh scripts/cutover/*.sh scripts/install-hooks.sh apps/ios/scripts/*.sh

      - name: Destructive migration guard tests
        run: python3 scripts/ci/sql_executed_text_test.py

      - name: Claude Code guard tests
        run: python3 .claude/hooks/guard_test.py

      - name: Edge secrets push script tests
        run: bash scripts/cutover/set-edge-secrets_test.sh

  # ------------------------------------------------------------------
  # Supabase: append-only migrations, migrations from scratch, pgTAP,
  # generated-types drift.
  # ------------------------------------------------------------------
  supabase:
    name: Supabase (migrations, pgTAP, types)
    needs: changes
    if: needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only check diffs against the PR base / previous main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The drift check normalises the generator's output (X-34); test that first.
      - name: DB types normaliser tests
        run: node --test packages/db-types/scripts/gen-types.test.mjs

      - name: Migrations are append-only
        if: needs.changes.outputs.migrations == 'true' && github.event_name != 'workflow_dispatch'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/check-migrations.sh diff "$BASE" HEAD

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start Supabase (without heavy services)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,analytics,vector

      - name: Reset database (migrations + seed)
        run: supabase db reset

      - name: pgTAP
        run: supabase test db

      # Same script as `pnpm db:types:check`: generate, stable-sort each Relationships
      # array, then diff -u against the committed file.
      - name: DB types drift
        run: |
          if ! node packages/db-types/scripts/gen-types.mjs --check; then
            echo "::error::packages/db-types is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ------------------------------------------------------------------
  # Edge Functions: deno lint + deno fmt --check + deno check + unit tests.
  # deno.json sets the lock to frozen, so every step also fails if
  # supabase/functions/deno.lock doesn't match the dependency graph.
  # ------------------------------------------------------------------
  edge:
    name: Edge Functions (deno)
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/deno.lock', 'supabase/functions/deno.json') }}

      - name: deno lint
        run: deno lint

      - name: deno fmt --check
        run: deno fmt --check

      - name: deno check (frozen lock)
        run: deno check --frozen .

      - name: deno test
        run: deno test --frozen -A .

  # ------------------------------------------------------------------
  # Parser: ruff + pytest (golden parity skips without the private PDFs)
  # ------------------------------------------------------------------
  parser:
    name: Parser (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/parser
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            services/parser/requirements.txt
            services/parser/pyproject.toml

      - name: Install
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip sync --python .venv/bin/python requirements.txt
          uv pip install --python .venv/bin/python --no-deps -e .
          uv pip install --python .venv/bin/python pytest ruff

      - name: ruff
        run: .venv/bin/ruff check --output-format=github .

      - name: pytest
        run: .venv/bin/pytest -q

  # ------------------------------------------------------------------
  # Web: design tokens drift, lint, typecheck, unit tests, production build
  # ------------------------------------------------------------------
  web:
    name: Web (tokens, lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails only if the committed Tokens.swift drifts from tokens.json; dist/ is
      # rebuilt by the web app's pretest/prebuild scripts.
      - name: Tokens (generated Swift is committed and must be current)
        run: pnpm --filter @ledger/tokens check

      - name: Lint
        run: pnpm --filter @ledger/web lint

      - name: Typecheck
        run: pnpm --filter @ledger/tokens build && pnpm --filter @ledger/web typecheck

      - name: Test
        run: pnpm --filter @ledger/web test

      - name: Build
        run: pnpm --filter @ledger/web build

  # ------------------------------------------------------------------
  # Scraper: unit tests (no browser needed; Playwright is mocked)
  # ------------------------------------------------------------------
  scraper:
    name: Scraper (pytest)
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            scraper/pyproject.toml
            scraper/requirements.txt

      - name: Install
        run: |
          uv venv --python "$PYTHON_VERSION" .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: pytest
        run: .venv/bin/pytest -q

  # ------------------------------------------------------------------
  # The single required check. Skipped jobs (area unchanged) count as
  # passing; a failed or cancelled job fails this one.
  # ------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, tooling, supabase, edge, parser, web, scraper]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Summarise and gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### CI results"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$RESULTS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "::error::Failed or cancelled: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "All required checks passed or were skipped (area unchanged)."
