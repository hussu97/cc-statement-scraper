name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_ios:
        description: "Also run the macOS LedgerKit tests (expensive runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so `supabase gen types` output is stable for the drift check.
  # Bump together with a `pnpm db:types` regeneration.
  SUPABASE_CLI_VERSION: 2.109.1

jobs:
  # ------------------------------------------------------------------
  # Detect which areas changed so downstream jobs can skip. A manual
  # run (workflow_dispatch) runs every v2 job (iOS only on request).
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter lists PR files through the REST API, which needs
    # pull-requests: read in a private repo (job-level permissions replace the
    # workflow-level block, so contents: read is repeated).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
      edge: ${{ steps.filter.outputs.edge }}
      parser: ${{ steps.filter.outputs.parser }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      scraper: ${{ steps.filter.outputs.scraper }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            supabase:
              - 'supabase/migrations/**'
              - 'supabase/tests/**'
              - 'supabase/seed.sql'
              - 'supabase/config.toml'
              - 'packages/db-types/**'
              - '.github/workflows/ci.yml'
            edge:
              - 'supabase/functions/**'
              - 'supabase/config.toml'
              - '.github/workflows/ci.yml'
            parser:
              - 'services/parser/**'
              - 'docs/contracts/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            ios:
              - 'apps/ios/LedgerKit/**'
              - 'packages/tokens/**'
            scraper:
              - 'scraper/**'
            backend:
              - 'backend/**'
              - 'deploy/Dockerfile.api'
              - 'deploy/docker-compose.prod.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/Dockerfile.frontend'

  # ------------------------------------------------------------------
  # Supabase: migrations from scratch, pgTAP, generated-types drift
  # ------------------------------------------------------------------
  supabase:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start Supabase (without heavy services)
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,analytics,vector

      - name: Reset database (migrations + seed)
        run: supabase db reset

      - name: pgTAP
        run: supabase test db

      - name: DB types drift
        run: |
          supabase gen types typescript --local > /tmp/database.ts
          if ! diff -u packages/db-types/src/database.ts /tmp/database.ts; then
            echo "::error::packages/db-types is stale. Run 'pnpm db:types' and commit the result."
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # ------------------------------------------------------------------
  # Edge Functions: deno unit tests (local e2e is opt-in, skipped here)
  # ------------------------------------------------------------------
  edge:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: deno test
        working-directory: supabase/functions
        run: deno test -A .

  # ------------------------------------------------------------------
  # Parser: ruff + pytest (golden parity skips without private PDFs)
  # ------------------------------------------------------------------
  parser:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.parser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/parser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip sync --python .venv/bin/python requirements.txt
          uv pip install --python .venv/bin/python --no-deps -e .
          uv pip install --python .venv/bin/python pytest ruff

      - name: ruff
        run: .venv/bin/ruff check .

      - name: pytest
        run: .venv/bin/pytest -q

  # ------------------------------------------------------------------
  # Web: design tokens drift, lint, unit tests, production build
  # ------------------------------------------------------------------
  web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails only if the committed Tokens.swift drifts from tokens.json; dist/ is
      # rebuilt by the web app's pretest/prebuild scripts.
      - name: Tokens (generated Swift is committed and must be current)
        run: pnpm --filter @ledger/tokens check

      - name: Lint
        run: pnpm --filter @ledger/web lint

      - name: Test
        run: pnpm --filter @ledger/web test

      - name: Build
        run: pnpm --filter @ledger/web build

  # ------------------------------------------------------------------
  # iOS: LedgerKit unit tests on macOS. macOS minutes are expensive,
  # so this runs only when LedgerKit/tokens change or on request.
  # ------------------------------------------------------------------
  ios:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.include_ios) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.ios == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/cache@v4
        with:
          path: apps/ios/LedgerKit/.build
          key: ledgerkit-${{ runner.os }}-${{ hashFiles('apps/ios/LedgerKit/Package.resolved') }}
          restore-keys: ledgerkit-${{ runner.os }}-

      - name: swift test (LedgerKit)
        working-directory: apps/ios/LedgerKit
        run: swift test

  # ------------------------------------------------------------------
  # Scraper: unit tests (no browser needed — mocked)
  # ------------------------------------------------------------------
  scraper:
    needs: changes
    if: needs.changes.outputs.scraper == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -e "scraper/[dev]"

      - name: Run tests
        run: cd scraper && python -m pytest -q

  # ==================================================================
  # LEGACY (v1) — backend/ and frontend/ are frozen and deleted at
  # cutover (PRODUCTION.md §10). Remove these jobs with them.
  # ==================================================================

  # Backend: tests + migrations (runs in parallel with backend-security)
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ccs
          POSTGRES_PASSWORD: ccs
          POSTGRES_DB: ccs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccs -d ccs"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: cd backend && pip install -e . -r requirements.txt -r requirements-dev.txt pytest-xdist

      - name: Syntax check
        run: python -m compileall backend/ccs_platform backend/scripts

      - name: Run tests
        run: cd backend && python -m pytest -q -n auto

      - name: Migration smoke (SQLite)
        env:
          CCS_PLATFORM_DATABASE_URL: sqlite:///./ci.db
        run: |
          cd backend
          python scripts/migration_preflight.py --skip-database-state
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python scripts/migration_preflight.py

      - name: Migration smoke (Postgres)
        env:
          CCS_PLATFORM_DATABASE_URL: postgresql+psycopg://ccs:ccs@127.0.0.1:5432/ccs
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python scripts/migration_preflight.py

  # Backend security: vulnerability + SAST scans (parallel with backend)
  backend-security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install audit tools
        run: pip install pip-audit bandit

      - name: Dependency vulnerability scan
        run: grep -v '^-e' backend/requirements.txt | pip-audit -r /dev/stdin --strict

      - name: SAST scan
        run: bandit -q -r backend/ccs_platform -x backend/tests -ll -ii

  # Frontend: unit tests + build
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm test -- --run
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
