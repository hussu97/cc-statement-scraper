name: iOS build

# Compiles the iPhone app and the share extension (X-26, IOS-11): `ci.yml` only
# runs LedgerKit's `swift test`, so a broken app, App Intent or extension
# target would otherwise first show up in the pre-push TestFlight build.
#
# macOS minutes bill at 10x, so this runs weekly, when the app sources change
# and on demand, not on every push. It never signs (CODE_SIGNING_ALLOWED=NO)
# and needs no secrets: Config/Secrets*.xcconfig are optional includes.
# The project is regenerated from apps/ios/project.yml with xcodegen first,
# exactly as apps/ios/scripts/testflight.sh does. Docs: docs/ci-cd.md.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  pull_request:
    paths:
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '!apps/ios/build-number.json'
      - 'packages/tokens/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - '!apps/ios/**/*.md'
      - '!apps/ios/build-number.json'
      - 'packages/tokens/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: xcodebuild (app + share extension, simulator, unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-app-${{ runner.os }}-${{ hashFiles('apps/ios/project.yml', 'apps/ios/**/Package.resolved') }}
          restore-keys: spm-app-${{ runner.os }}-

      - name: xcodegen
        run: |
          brew install xcodegen
          xcodegen generate --quiet

      - name: xcodebuild build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ledger.xcodeproj \
            -scheme Ledger \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\* BUILD|error:|.*: error:)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"
