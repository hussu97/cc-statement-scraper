# XcodeGen spec — the Xcode project is generated from this file:
#   cd apps/ios && xcodegen generate
# Ledger.xcodeproj is committed too so a fresh clone opens without XcodeGen.
name: Ledger
options:
  bundleIdPrefix: com.hussu97.ledger
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  LedgerKit:
    path: LedgerKit
targets:
  Ledger:
    type: application
    platform: iOS
    sources:
      - path: Ledger
    dependencies:
      - package: LedgerKit
      - target: LedgerShare
        embed: true
        codeSign: true
    entitlements:
      path: Ledger/Ledger.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LEDGER_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(LEDGER_KEYCHAIN_GROUP)
        # Passkeys: the Supabase WebAuthn relying party is the web app's host,
        # which serves /.well-known/apple-app-site-association (apps/web/public).
        com.apple.developer.associated-domains:
          - webcredentials:$(LEDGER_PASSKEY_DOMAIN)
    info:
      path: Ledger/Info.plist
      properties:
        CFBundleDisplayName: Bank Ledger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Settings → Privacy → Require Face ID (LedgerKit AppLock, BACKLOG IOS-22).
        NSFaceIDUsageDescription: Bank Ledger asks for Face ID to unlock when you turn on Require Face ID in Settings.
        # SMS saved with no data are sent from background tasks once a
        # connection is back (LedgerKit OutboxSync; IDs must match).
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - com.hussu97.ledger.outbox-refresh
          - com.hussu97.ledger.outbox-send
        # No NSAppTransportSecurity here: Release allows HTTPS only. Debug adds
        # NSAllowsLocalNetworking in the "Debug ATS" script below (BACKLOG IOS-30).
        LedgerSupabaseURL: $(LEDGER_SUPABASE_URL)
        LedgerSupabasePublishableKey: $(LEDGER_SUPABASE_PUBLISHABLE_KEY)
        LedgerSentryDSN: $(LEDGER_SENTRY_DSN)
        LedgerEnvironment: $(LEDGER_ENVIRONMENT)
        LedgerAppGroup: $(LEDGER_APP_GROUP)
        LedgerKeychainGroup: $(AppIdentifierPrefix)$(LEDGER_KEYCHAIN_GROUP)
        LedgerPasskeyDomain: $(LEDGER_PASSKEY_DOMAIN)
    preBuildScripts:
      - name: Debug ATS
        # Debug talks to `supabase start` over plain HTTP (127.0.0.1 from the
        # simulator, the Mac's LAN address from a device). Debug's Info.plist is
        # a copy of the generated one plus NSAllowsLocalNetworking; Release reads
        # Ledger/Info.plist as generated, without it.
        script: |
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' \
            -o - "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(SRCROOT)/Ledger/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/Info.Debug.plist
    settings:
      configs:
        Debug:
          INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Info.Debug.plist
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEDGER_BUNDLE_PREFIX)
        PRODUCT_NAME: Ledger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  LedgerShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    dependencies:
      - package: LedgerKit
    entitlements:
      path: ShareExtension/LedgerShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(LEDGER_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(LEDGER_KEYCHAIN_GROUP)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to Bank Ledger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # NSAllowsLocalNetworking: Debug only, as for the app (IOS-30).
        LedgerSupabaseURL: $(LEDGER_SUPABASE_URL)
        LedgerSupabasePublishableKey: $(LEDGER_SUPABASE_PUBLISHABLE_KEY)
        LedgerSentryDSN: $(LEDGER_SENTRY_DSN)
        LedgerEnvironment: $(LEDGER_ENVIRONMENT)
        LedgerAppGroup: $(LEDGER_APP_GROUP)
        LedgerKeychainGroup: $(AppIdentifierPrefix)$(LEDGER_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY (extensionItems, $extensionItem,
              SUBQUERY ($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              ).@count >= 1).@count >= 1
    preBuildScripts:
      - name: Debug ATS
        script: |
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true}' \
            -o - "$SCRIPT_INPUT_FILE_0" > "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(SRCROOT)/ShareExtension/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/Info.Debug.plist
    settings:
      configs:
        Debug:
          INFOPLIST_FILE: $(DERIVED_FILE_DIR)/Info.Debug.plist
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LEDGER_BUNDLE_PREFIX).share
        PRODUCT_NAME: LedgerShare
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  Ledger:
    build:
      targets:
        Ledger: all
        LedgerShare: all
    run:
      config: Debug
    archive:
      config: Release
