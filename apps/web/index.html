<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Bank Ledger: credit-card spending from your statements and bank SMS, in one place." />
    <meta name="application-name" content="Bank Ledger" />
    <meta name="apple-mobile-web-app-title" content="Bank Ledger" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F1EA" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1815" />
    <!-- Icons are generated from assets/brand/bank-ledger-mark.svg: `pnpm brand:icons`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Bank Ledger</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("ledger.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
