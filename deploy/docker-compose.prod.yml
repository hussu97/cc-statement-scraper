services:
  api:
    build:
      context: ..
      # Slim image — no Playwright. API process never launches a browser.
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ${CCS_ENV_FILE:-.env.production}
    environment:
      CCS_PLATFORM_EMBEDDED_WORKER: "false"
    command: ["python", "-m", "ccs_platform.cli", "api", "--host", "0.0.0.0", "--port", "8040"]
    volumes:
      - ${CCS_DATA_DIR:-../data}:/app/data
      - ${CCS_LOGS_DIR:-../logs}:/app/logs
    networks:
      - app_internal
    expose:
      - "8040"
    restart: unless-stopped

  worker:
    build:
      context: ..
      # Full image with Playwright — browser scraping requires outbound internet.
      dockerfile: deploy/Dockerfile.app
    env_file:
      - ${CCS_ENV_FILE:-.env.production}
    environment:
      CCS_PLATFORM_EMBEDDED_WORKER: "false"
    command: ["python", "-m", "ccs_platform.cli", "worker"]
    volumes:
      - ${CCS_DATA_DIR:-../data}:/app/data
      - ${CCS_LOGS_DIR:-../logs}:/app/logs
    networks:
      - app_internal
      # edge_public gives the worker outbound internet access for browser scraping.
      # The API and frontend containers do NOT get edge_public — only Caddy exposes
      # inbound traffic from the internet.
      - edge_public
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    expose:
      - "8080"
    networks:
      - app_internal
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2
    env_file:
      - ${CCS_ENV_FILE:-.env.production}
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_internal
      - edge_public
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  # Internal-only network for inter-service communication.
  # No outbound internet access — containers here cannot be reached from outside.
  app_internal:
    internal: true
  # Public-facing network. Only reverse-proxy (inbound) and worker (outbound scraping)
  # are attached here.
  edge_public:
