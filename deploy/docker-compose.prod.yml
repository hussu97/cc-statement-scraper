services:
  api:
    build:
      context: ..
      # Slim image — no Playwright. API handles all job types except browser scraping.
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ${CCS_ENV_FILE:-.env.production}
    environment:
      CCS_PLATFORM_EMBEDDED_WORKER: "true"
    command: ["python", "-m", "ccs_platform.cli", "api", "--host", "0.0.0.0", "--port", "8040"]
    volumes:
      - ${CCS_DATA_DIR:-../data}:/app/data
      - ${CCS_LOGS_DIR:-../logs}:/app/logs
    networks:
      - app_internal
      # API needs outbound connectivity for GCS uploads and email relay calls.
      - edge_public
    expose:
      - "8040"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    expose:
      - "8080"
    networks:
      - app_internal
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2
    env_file:
      - ${CCS_ENV_FILE:-.env.production}
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_internal
      - edge_public
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  # Internal-only network for inter-service communication.
  app_internal:
    internal: true
  # Public-facing network. Only reverse-proxy (inbound) and api (outbound GCS/email) use this.
  edge_public:
