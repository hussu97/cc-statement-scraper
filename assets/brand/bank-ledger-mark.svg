<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Bank Ledger mark: a ledger column (an entry, a right-aligned amount) closed
    by the accountant's double rule under the total. Every edge sits on an even
    unit of the 32-unit grid, so it stays pixel-crisp at 16px. Colours are the
    packages/tokens values (light accent + bg, dark accent + bg);
    scripts/brand/generate-icons.mjs fails if they drift. Edit the glyph here,
    then run `pnpm brand:icons`.
  -->
  <title>Bank Ledger</title>
  <style>
    .tile { fill: #964F2F; }
    .glyph { fill: #F5F1EA; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #D08A63; }
      .glyph { fill: #1A1815; }
    }
  </style>
  <rect id="tile" class="tile" width="32" height="32" rx="8"/>
  <g id="glyph" class="glyph">
    <rect x="8" y="6" width="16" height="4" rx="2"/>
    <rect x="14" y="12" width="10" height="4" rx="2"/>
    <rect x="8" y="20" width="16" height="2" rx="1"/>
    <rect x="8" y="24" width="16" height="2" rx="1"/>
  </g>
</svg>
