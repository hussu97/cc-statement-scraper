[project]
name = "ccs-parser"
version = "2026.10.5"
description = "Stateless credit-card statement PDF parsing service (contract parse-v1)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn (h11 + asyncio): the [standard] extras (uvloop, httptools, watchfiles,
    # websockets, python-dotenv, pyyaml) are unused by a one-endpoint JSON service (SRV-13).
    "uvicorn>=0.30",
    # pdfplumber / pdfminer.six are pinned exactly: text extraction output drives
    # every regex in the bank parsers, so upgrades must re-run the golden parity suite.
    "pdfplumber==0.11.9",
    "pdfminer.six==20251230",
    "pypdf>=6.13.0",
    "httpx>=0.28",
    "pydantic>=2.9,<3",
    "sentry-sdk[fastapi]>=2.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ccs_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
# Legacy parsers are copied verbatim from the (removed) v1 backend for golden parity;
# keep their style untouched rather than reformatting them.
"ccs_parser/banks/*.py" = ["I", "UP", "B", "E", "W", "F841"]
"ccs_parser/domain/**/*.py" = ["I", "UP", "B"]
"ccs_parser/parser_adapter.py" = ["I", "UP", "B"]
