[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-platform"
version = "0.1.0"
description = "DB-first credit card statement platform with API, worker, and admin UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pdfplumber>=0.11",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "python-multipart>=0.0.9",
  "google-cloud-storage>=2.16",
  "cryptography>=43.0",
  "itsdangerous>=2.2",
  "bcrypt>=4.0",
]

[project.optional-dependencies]
export = [
  "pandas>=2.2",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.28",
]

[project.scripts]
ccs-platform = "ccs_platform.cli:cli"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
